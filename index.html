    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- アイコン変換用コンポーネント ---
        const IconWrapper = ({ name, size = 24, color = "currentColor", className = "", ...props }) => {
            if (typeof lucide === 'undefined' || !lucide.icons || !lucide.icons[name]) {
                return <span style={{ width: size, height: size, display: 'inline-block' }} />;
            }
            const iconData = lucide.icons[name];
            const childrenRaw = Array.isArray(iconData) ? iconData[2] : iconData.children;
            const children = Array.isArray(childrenRaw) ? childrenRaw : [];

            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                    {children.map((child, index) => {
                        let tag, attrs;
                        if (Array.isArray(child)) { tag = child[0]; attrs = child[1]; } 
                        else if (typeof child === 'object' && child !== null) { tag = child.tag || child.name; attrs = child.attrs || {}; }
                        if (!tag) return null;
                        return React.createElement(tag, { ...attrs, key: index });
                    })}
                </svg>
            );
        };

        const Phone = (props) => <IconWrapper name="Phone" {...props} />;
        const MapPin = (props) => <IconWrapper name="MapPin" {...props} />;
        const Menu = (props) => <IconWrapper name="Menu" {...props} />;
        const X = (props) => <IconWrapper name="X" {...props} />;
        const Star = (props) => <IconWrapper name="Star" {...props} />;
        const Sparkles = (props) => <IconWrapper name="Sparkles" {...props} />;
        const Leaf = (props) => <IconWrapper name="Leaf" {...props} />;
        const Activity = (props) => <IconWrapper name="Activity" {...props} />;
        const User = (props) => <IconWrapper name="User" {...props} />;
        const Clock = (props) => <IconWrapper name="Clock" {...props} />;

            const toggleMenu = () => setIsMenuOpen(!isMenuOpen);

                    element.scrollIntoView({ behavior: 'smooth' });
                }
