<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>しまざき整骨院 | 戸田市の治療と美容のトータルケア</title>
    
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.6s ease-out forwards; }
        
        /* アコーディオンのアニメーション */
        .accordion-content {
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .accordion-content.open {
            max-height: 500px;
            opacity: 1;
        }

        #root { min-height: 100vh; }
    </style>
</head>
<body class="bg-stone-50 text-gray-700 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- アイコン変換用コンポーネント ---
        const IconWrapper = ({ name, size = 24, color = "currentColor", className = "", ...props }) => {
            if (typeof lucide === 'undefined' || !lucide.icons || !lucide.icons[name]) {
                return <span style={{ width: size, height: size, display: 'inline-block' }} />;
            }
            const iconData = lucide.icons[name];
            const childrenRaw = Array.isArray(iconData) ? iconData[2] : iconData.children;
            const children = Array.isArray(childrenRaw) ? childrenRaw : [];

            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                    {children.map((child, index) => {
                        let tag, attrs;
                        if (Array.isArray(child)) { tag = child[0]; attrs = child[1]; } 
                        else if (typeof child === 'object' && child !== null) { tag = child.tag || child.name; attrs = child.attrs || {}; }
                        if (!tag) return null;
                        return React.createElement(tag, { ...attrs, key: index });
                    })}
                </svg>
            );
        };

        const Phone = (props) => <IconWrapper name="Phone" {...props} />;
        const MapPin = (props) => <IconWrapper name="MapPin" {...props} />;
        const Menu = (props) => <IconWrapper name="Menu" {...props} />;
        const X = (props) => <IconWrapper name="X" {...props} />;
        const Star = (props) => <IconWrapper name="Star" {...props} />;
        const Sparkles = (props) => <IconWrapper name="Sparkles" {...props} />;
        const Leaf = (props) => <IconWrapper name="Leaf" {...props} />;
        const Activity = (props) => <IconWrapper name="Activity" {...props} />;
        const User = (props) => <IconWrapper name="User" {...props} />;
        const Clock = (props) => <IconWrapper name="Clock" {...props} />;
        const ChevronDown = (props) => <IconWrapper name="ChevronDown" {...props} />;
        const MessageCircle = (props) => <IconWrapper name="MessageCircle" {...props} />;
        const CalendarCheck = (props) => <IconWrapper name="CalendarCheck" {...props} />;
        const HelpCircle = (props) => <IconWrapper name="HelpCircle" {...props} />;

        // --- セクションタイトルコンポーネント ---
        const SectionTitle = ({ subtitle, title, description }) => (
            <div className="text-center mb-16">
                {subtitle && <span className="text-emerald-600 font-bold tracking-widest uppercase mb-2 block">{subtitle}</span>}
                <h3 className="text-3xl font-bold text-gray-800 mb-4">{title}</h3>
                {description && <p className="text-gray-600 max-w-2xl mx-auto">{description}</p>}
            </div>
        );

        // --- FAQ アイテムコンポーネント ---
        const FAQItem = ({ question, answer }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="border-b border-gray-200 last:border-0">
                    <button 
                        onClick={() => setIsOpen(!isOpen)} 
                        className="w-full flex justify-between items-center py-4 text-left focus:outline-none group"
                    >
                        <span className="font-bold text-gray-800 group-hover:text-emerald-600 transition">{question}</span>
                        <div className={`transform transition duration-300 text-emerald-500 ${isOpen ? 'rotate-180' : ''}`}>
                            <ChevronDown size={20} />
                        </div>
                    </button>
                    <div className={`accordion-content ${isOpen ? 'open' : ''}`}>
                        <div className="pb-4 text-gray-600 text-sm leading-relaxed">
                            {answer}
                        </div>
                    </div>
                </div>
            );
        };

        // --- メインアプリケーション ---
        const ShimazakiSeikotsuin = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [showMobileFab, setShowMobileFab] = useState(false);
            
            // スクロール検知でFABを表示
            useEffect(() => {
                const handleScroll = () => {
                    if (window.scrollY > 300) {
                        setShowMobileFab(true);
                    } else {
                        setShowMobileFab(false);
                    }
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);
            
            const toggleMenu = () => setIsMenuOpen(!isMenuOpen);

            const handleNavClick = (e, targetId) => {
                e.preventDefault();
                setIsMenuOpen(false);
                const element = document.querySelector(targetId);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                }
            };

            const images = {
                hero: "https://midomo.jp/wp-content/uploads/2025/09/1000000233-scaled.jpg", 
                director: "https://midomo.jp/wp-content/uploads/2025/09/1000000242-scaled.jpg", 
                ems: "https://midomo.jp/wp-content/uploads/2025/09/1000000235-scaled.jpg", 
                exterior: "https://midomo.jp/wp-content/uploads/2025/09/1000000236-scaled.jpg", 
                product: "https://midomo.jp/wp-content/uploads/2025/09/1000000248-scaled.jpg" 
            };

            return (
                <div className="font-sans text-gray-700 bg-stone-50 pb-24 md:pb-0 relative min-h-screen">
                    {/* Header */}
                    <header className="fixed top-0 left-0 w-full bg-white/95 backdrop-blur-md shadow-sm z-50 border-b border-stone-100">
                        <div className="container mx-auto px-4 py-3 md:py-4 flex justify-between items-center">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})}>
                                <div className="bg-emerald-600 p-2 rounded-lg text-white">
                                <Activity size={24} />
                                </div>
                                <div>
                                <h1 className="text-lg md:text-xl font-bold text-gray-800 tracking-tight leading-none">しまざき整骨院</h1>
                                <p className="text-[10px] md:text-xs text-gray-500">埼玉県戸田市 / 治療＋美容のトータルケア</p>
                                </div>
                            </div>

                            <nav className="hidden md:flex gap-6 font-medium text-sm text-gray-600">
                                <a href="#about" onClick={(e) => handleNavClick(e, '#about')} className="hover:text-emerald-600 transition cursor-pointer">当院について</a>
                                <a href="#menu" onClick={(e) => handleNavClick(e, '#menu')} className="hover:text-emerald-600 transition cursor-pointer">施術・料金</a>
                                <a href="#flow" onClick={(e) => handleNavClick(e, '#flow')} className="hover:text-emerald-600 transition cursor-pointer">施術の流れ</a>
                                <a href="#ems" onClick={(e) => handleNavClick(e, '#ems')} className="hover:text-emerald-600 transition text-emerald-600 font-bold cursor-pointer">EMS・美容</a>
                                <a href="#voice" onClick={(e) => handleNavClick(e, '#voice')} className="hover:text-emerald-600 transition cursor-pointer">お客様の声</a>
                                <a href="#access" onClick={(e) => handleNavClick(e, '#access')} className="hover:text-emerald-600 transition cursor-pointer">アクセス</a>
                            </nav>

                            <button onClick={toggleMenu} className="md:hidden text-gray-600 p-1">
                                {isMenuOpen ? <X size={28} /> : <Menu size={28} />}
                            </button>
                        </div>

                        {/* Mobile Menu */}
                        {isMenuOpen && (
                            <div className="md:hidden bg-white border-t p-4 flex flex-col gap-4 shadow-lg absolute w-full left-0 z-40 animate-in">
                                <a href="#about" onClick={(e) => handleNavClick(e, '#about')} className="block py-2 border-b border-gray-100">当院について</a>
                                <a href="#menu" onClick={(e) => handleNavClick(e, '#menu')} className="block py-2 border-b border-gray-100">施術・料金</a>
                                <a href="#flow" onClick={(e) => handleNavClick(e, '#flow')} className="block py-2 border-b border-gray-100">初めての方へ（流れ）</a>
                                <a href="#ems" onClick={(e) => handleNavClick(e, '#ems')} className="block py-2 font-bold text-emerald-600 border-b border-gray-100">EMS・美容メニュー</a>
                                <a href="#voice" onClick={(e) => handleNavClick(e, '#voice')} className="block py-2 border-b border-gray-100">お客様の声</a>
                                <a href="#access" onClick={(e) => handleNavClick(e, '#access')} className="block py-2">アクセス</a>
                            </div>
                        )}
                    </header>

                    {/* Hero Section */}
                    <section className="relative pt-28 pb-16 md:pt-40 md:pb-24 bg-gradient-to-br from-emerald-50 to-stone-100 overflow-hidden">
                        <div className="absolute top-0 right-0 w-1/2 h-full bg-emerald-100/30 skew-x-12 transform origin-top-right"></div>
                        <div className="container mx-auto px-4 relative z-10">
                        <div className="flex flex-col md:flex-row items-center gap-12">
                            <div className="md:w-1/2 animate-in" style={{animationDelay: '0.1s'}}>
                            <span className="inline-block py-1 px-3 bg-emerald-600 text-white text-xs font-bold rounded-full mb-4 shadow-md">
                                創業40年の信頼と実績
                            </span>
                            <h2 className="text-3xl md:text-5xl lg:text-6xl font-bold text-gray-800 leading-tight mb-6">
                                痛みを取り除く「治療」と<br />
                                笑顔を輝かせる「美容」を。
                            </h2>
                            <p className="text-base md:text-lg text-gray-600 mb-8 leading-relaxed">
                                戸田市で愛され続けて40年。<br />
                                熟練の手技と最新の医療機器EMSで、<br />
                                あなたの身体の不調と美容のお悩みをトータルサポートします。
                            </p>
                            <div className="flex flex-col sm:flex-row gap-4">
                                <a href="#menu" onClick={(e) => handleNavClick(e, '#menu')} className="px-8 py-4 bg-emerald-600 text-white rounded-xl font-bold shadow-lg hover:bg-emerald-700 transition text-center flex items-center justify-center gap-2 cursor-pointer hover:shadow-emerald-500/30 transform hover:-translate-y-1">
                                <Sparkles size={20} />
                                施術メニューを見る
                                </a>
                                <a href="tel:0484448793" className="px-8 py-4 bg-white text-emerald-600 border-2 border-emerald-600 rounded-xl font-bold hover:bg-emerald-50 transition text-center flex items-center justify-center gap-2">
                                <Phone size={20} />
                                電話で予約する
                                </a>
                            </div>
                            </div>
                            
                            <div className="md:w-1/2 w-full animate-in" style={{animationDelay: '0.3s'}}>
                                <img 
                                    src={images.hero} 
                                    alt="しまざき整骨院 内観" 
                                    className="w-full h-64 md:h-96 object-cover rounded-2xl shadow-2xl border-4 border-white rotate-1 hover:rotate-0 transition duration-500"
                                />
                            </div>
                        </div>
                        </div>
                    </section>

                    {/* About Section */}
                    <section id="about" className="py-20 bg-white">
                        <div className="container mx-auto px-4">
                        <div className="flex flex-col md:flex-row gap-12 items-center">
                            
                            <div className="md:w-1/2 w-full order-2 md:order-1 relative">
                                <div className="absolute top-4 -left-4 w-24 h-24 bg-emerald-100 rounded-full -z-10"></div>
                                <div className="absolute -bottom-4 -right-4 w-32 h-32 bg-stone-100 rounded-full -z-10"></div>
                                <div className="relative max-w-md mx-auto">
                                    <img 
                                        src={images.director} 
                                        alt="院長 嶋崎 進" 
                                        className="w-full h-80 md:h-[450px] object-cover rounded-2xl shadow-xl"
                                    />
                                    
                                    <div className="absolute -bottom-6 right-0 left-0 mx-auto w-11/12 bg-white/95 backdrop-blur p-6 rounded-xl shadow-lg border border-gray-100 text-center">
                                    <p className="text-emerald-600 font-bold text-sm mb-1">院長</p>
                                    <p className="text-2xl font-bold text-gray-800">嶋崎 進</p>
                                    </div>
                                </div>
                            </div>

                            <div className="md:w-1/2 pt-8 md:pt-0 order-1 md:order-2">
                            <h3 className="text-emerald-600 font-bold tracking-wider mb-2">ご挨拶</h3>
                            <h4 className="text-2xl md:text-3xl font-bold text-gray-800 mb-6">「楽しいからやっている」<br />それが私の原動力です。</h4>
                            <p className="text-gray-600 leading-relaxed mb-6 text-justify">
                                親の代から受け継ぎ、この地で40年間、皆様の健康と向き合ってきました。
                                65歳を迎え、「これまでの整骨院の枠を超えた新しい挑戦」として、治療に加えて「美容」の分野にも力を入れています。
                            </p>
                            <p className="text-gray-600 leading-relaxed mb-6 text-justify">
                                苦しんでいる患者様を目の前にして、放っておくことはできません。
                                「使命感」という堅苦しいものではなく、患者様が元気になり、美しくなって喜ぶ姿を見るのが、私にとって何よりの「楽しさ」なのです。
                            </p>
                            <div className="p-4 bg-stone-100 rounded-lg border-l-4 border-emerald-500">
                                <p className="italic text-gray-700 font-medium">
                                「年齢を重ねても、誰もが綺麗でありたいと願っています。健康な体と美しい笑顔、その両方をサポートするのが私の役目です。」
                                </p>
                            </div>
                            </div>
                        </div>
                        </div>
                    </section>

                    {/* Menu & Pricing */}
                    <section id="menu" className="py-20 bg-stone-50">
                        <div className="container mx-auto px-4">
                        <SectionTitle 
                            title="施術メニュー・料金" 
                            description="急な痛みへの保険診療から、慢性痛・美容のための自由診療まで。わかりやすい料金設定で安心して通っていただけます。"
                        />

                        <div className="grid md:grid-cols-2 gap-8 max-w-5xl mx-auto">
                            {/* 保険診療 */}
                            <div className="bg-white rounded-2xl shadow-lg p-8 border-t-4 border-blue-500 hover:shadow-xl transition duration-300">
                            <div className="flex items-center gap-3 mb-6">
                                <div className="p-2 bg-blue-100 text-blue-600 rounded-lg">
                                <Activity size={24} />
                                </div>
                                <div>
                                    <h4 className="text-xl md:text-2xl font-bold text-gray-800">保険診療</h4>
                                    <p className="text-xs font-bold text-blue-600 mt-1">月・水・金曜日</p>
                                </div>
                            </div>
                            <p className="text-sm text-gray-500 mb-6 border-b pb-4">
                                捻挫・打撲・挫傷・骨折・脱臼など、原因のはっきりしている急性のケガに適用されます。
                            </p>

                            <ul className="space-y-4">
                                <li className="flex justify-between items-center">
                                <span className="font-medium">初診料（目安）</span>
                                <span className="text-xl font-bold text-blue-600">800円 〜 1,000円</span>
                                </li>
                                <li className="text-xs text-gray-400 text-right">※負担割合や部位数により変動します</li>
                            </ul>
                            </div>

                            {/* 自費診療 */}
                            <div className="bg-white rounded-2xl shadow-lg p-8 border-t-4 border-emerald-500 relative overflow-hidden hover:shadow-xl transition duration-300">
                            <div className="absolute top-0 right-0 bg-emerald-500 text-white text-xs font-bold px-3 py-1 rounded-bl-lg">
                                自費診療
                            </div>
                            <div className="flex items-center gap-3 mb-6">
                                <div className="p-2 bg-emerald-100 text-emerald-600 rounded-lg">
                                <Sparkles size={24} />
                                </div>
                                <div>
                                    <h4 className="text-xl md:text-2xl font-bold text-gray-800">美顔・難治性治療</h4>
                                    <p className="text-xs font-bold text-emerald-600 mt-1">火・木・土曜日</p>
                                </div>
                            </div>
                            <p className="text-sm text-gray-500 mb-6 border-b pb-4">
                                美容目的や慢性的なお悩み、なかなか治らない症状への特別治療です。
                            </p>

                            <ul className="space-y-6">
                                <li className="flex justify-between items-end border-b border-dashed pb-2">
                                <div>
                                    <span className="font-bold block text-lg text-emerald-700">美顔・美肌コース</span>
                                    <span className="text-xs text-gray-500">15分 / 細胞レベルで活性化</span>
                                </div>
                                <span className="text-xl font-bold text-gray-800">2,000円</span>
                                </li>
                                <li className="flex justify-between items-end border-b border-dashed pb-2">
                                <div>
                                    <span className="font-bold block text-lg text-emerald-700">EMS リフトアップ</span>
                                    <span className="text-xs text-gray-500">10分 / 表情筋トレーニング</span>
                                </div>
                                <span className="text-xl font-bold text-gray-800">2,000円</span>
                                </li>
                                <li className="flex justify-between items-end pb-2 bg-yellow-50 p-3 rounded-lg border border-yellow-100">
                                <div>
                                    <span className="font-bold block text-lg text-gray-800">両コースセット <span className="text-xs bg-red-500 text-white px-1 rounded ml-1">お得</span></span>
                                    <span className="text-xs text-gray-500">美顔 ＋ EMS（計25分）</span>
                                </div>
                                <span className="text-2xl font-bold text-red-500">3,000円</span>
                                </li>
                            </ul>
                            </div>
                        </div>
                        </div>
                    </section>

                     {/* Flow Section (New!) */}
                     <section id="flow" className="py-20 bg-white">
                        <div className="container mx-auto px-4">
                            <SectionTitle 
                                title="初めての方へ（施術の流れ）" 
                                description="初めて整骨院に来られる方もご安心ください。丁寧なカウンセリングと説明を心がけています。"
                            />
                            
                            <div className="max-w-4xl mx-auto">
                                <div className="grid md:grid-cols-4 gap-6">
                                    {[
                                        { step: "01", title: "受付", icon: "CalendarCheck", text: "ご来院されましたら、受付にて保険証をご提示ください。問診票の記入をお願いします。" },
                                        { step: "02", title: "カウンセリング", icon: "MessageCircle", text: "痛みの場所や状態、お悩みについて詳しくお伺いします。どんな些細なことでもご相談ください。" },
                                        { step: "03", title: "施術", icon: "Activity", text: "症状に合わせて、手技療法や電気治療機器（EMSなど）を組み合わせて最適な施術を行います。" },
                                        { step: "04", title: "説明・お会計", icon: "User", text: "今後の治療計画や日常生活での注意点をご説明します。最後にお会計をして終了です。" }
                                    ].map((item, index) => (
                                        <div key={index} className="relative bg-stone-50 p-6 rounded-xl border border-stone-100 text-center group hover:bg-emerald-50 transition duration-300">
                                            <div className="absolute -top-4 left-1/2 transform -translate-x-1/2 bg-white text-emerald-600 font-bold w-10 h-10 rounded-full flex items-center justify-center shadow-md border-2 border-emerald-500">
                                                {item.step}
                                            </div>
                                            <div className="mt-4 mb-3 text-emerald-600 flex justify-center">
                                                <IconWrapper name={item.icon} size={32} />
                                            </div>
                                            <h4 className="font-bold text-lg mb-2 text-gray-800">{item.title}</h4>
                                            <p className="text-sm text-gray-600 leading-snug">{item.text}</p>
                                            
                                            {/* Arrow for desktop */}
                                            {index < 3 && (
                                                <div className="hidden md:block absolute top-1/2 -right-3 transform -translate-y-1/2 z-10 text-gray-300">
                                                    <ChevronDown className="-rotate-90" size={24} />
                                                </div>
                                            )}
                                            {/* Arrow for mobile */}
                                            {index < 3 && (
                                                <div className="md:hidden absolute -bottom-5 left-1/2 transform -translate-x-1/2 z-10 text-gray-300">
                                                    <ChevronDown size={24} />
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                                <div className="text-center mt-12">
                                    <p className="text-gray-600 mb-6 bg-yellow-50 inline-block px-6 py-3 rounded-full border border-yellow-200 text-sm">
                                        <span className="font-bold text-yellow-600 mr-2">Point!</span>
                                        服装は動きやすい格好であれば、そのままで大丈夫です。
                                    </p>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* EMS & Beauty Feature Section */}
                    <section id="ems" className="py-20 bg-gradient-to-b from-stone-900 to-gray-800 text-white relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-full opacity-10 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
                        <div className="container mx-auto px-4 relative z-10">
                        <div className="text-center max-w-3xl mx-auto mb-16">
                            <span className="text-emerald-400 font-bold tracking-widest uppercase mb-2 block">Premium Care</span>
                            <h3 className="text-3xl md:text-5xl font-bold mb-6">寝ているだけで、深層筋トレーニング。<br/>話題の「EMSリフトアップ」</h3>

                            </div>

                                    { gender: "female", age: "40代女性", course: "EMS・美顔コース", text: "初めてEMSを受けましたが、顔の筋肉が勝手に動く感覚に驚きました！施術後は目がパッチリ開いて、フェイスラインがシュッとしました。定期的に通いたいと思います。" },

                                    question="保険証は使えますか？"
